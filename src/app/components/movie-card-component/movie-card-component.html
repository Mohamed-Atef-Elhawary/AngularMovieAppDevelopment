<mat-card class="h-[700px] md:h-[600px]" appearance="outlined">
  <img
    mat-card-image
    class="h-[70%] md:h-[60%]"
    src="{{ movie().Poster }}"
    alt="{{ movie().Title }}"
    (error)="onImageError($event)"
  />
  <mat-card-content class="pt-2! overflow-hidden grow">
    <h3 class="text-2xl text-gray-900">
      <span class="font-bold text-gray-600">title: </span>{{ movie().Title.slice(0, 30) }}
    </h3>
    <h3 class="text-2xl text-gray-500">
      <span class="font-bold text-gray-600">Year: </span>{{ movie().Year }}
    </h3>
    <h3 class="text-2xl text-indigo-600">
      <span class="font-bold text-gray-600">Type: </span>{{ movie().Type }}
    </h3>
  </mat-card-content>

  <mat-card-actions>
    <button
      matButton
      class="rounded-none! w-full! border! text-indego-700!"
      (click)="toggleFavorite()"
      [disabled]="isDisabled()"
    >
      {{ movie().isFavorite ? 'UnFivorite' : 'Fivorite' }}
    </button>
  </mat-card-actions>
</mat-card>
