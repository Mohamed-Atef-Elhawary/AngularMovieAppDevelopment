<!-- NavbarComponent.html -->

<nav mat-tab-nav-bar [tabPanel]="tabPanel" class="bg-indigo-300! flex! px-2">
  <div>
    <ul class="hidden sm:flex gap-2">
      @for (link of navLinks(); track link) {
        <li>
          <a
            mat-tab-link
            (click)="activeLink.set(link)"
            [active]="activeLink() == link"
            class="bg-indigo-300 text-white! font-semibold! tracking-[1px]!"
            [routerLink]="['/', link.toLowerCase()]"
          >
            {{ link }}
          </a>
        </li>
      }
    </ul>
    <div class="sm:hidden">
      <button matButton [matMenuTriggerFor]="menuLinks"><mat-icon>menu</mat-icon></button>
      <mat-menu #menuLinks="matMenu">
        @for (link of navLinks(); track link) {
          <a mat-menu-item [routerLink]="['/', link.toLowerCase()]">
            {{ link }}
          </a>
        }
      </mat-menu>
    </div>
  </div>

  <div class="flex gap-2 items-center">
    <mat-form-field appearance="outline" class="no-subscript w-[250px]">
      <mat-label>Search</mat-label>
      <input type="text" matInput (input)="onInput($event)" />
    </mat-form-field>

    <button mat-flat-button class="bg-sky-300! text-white! h-[40px]!">Search</button>
  </div>
</nav>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
