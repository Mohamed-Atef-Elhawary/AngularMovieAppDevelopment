<!-- homePage.html -->
<div class="grid grid-rows-2 grid-cols sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-1 m-2">
  @for (movie of movies(); track $index) {
    <app-movie-card-component [movieInput]="movie"></app-movie-card-component>
  }
</div>
<mat-paginator
  [length]="totalResults()"
  [pageSize]="10"
  (page)="onPageChange($event)"
  aria-label="Select page"
  class="bg-gray-200!"
>
</mat-paginator>
